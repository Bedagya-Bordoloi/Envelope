# building_policy.yaml
# Operator-editable hard bounds for Project Envelope.
# The Sentinel Gate loads this file at startup -- changing a rule, a
# weight, or a carbon mapping here changes system behavior with NO code
# edits and no redeploy. This is the single source of truth for every
# bound the gate enforces (see core/sentinel_gate.py's RuleEngine).

comfort:
  # Deadband between heating and cooling setpoints derived from a single
  # AI/baseline-proposed target (target = cooling setpoint;
  # heating setpoint = target - deadband). Wired into
  # core/energyplus_bridge.py -- both actuators are driven from this.
  deadband_c: 2.0

gate:
  ccs_threshold: 0.65
  weights:
    violation: 0.40
    # Increase this from 0.10 to 0.25 to punish the AI for changing its mind too often
    rate_penalty: 0.25     
    llm_confidence: 0.10
    override_rate: 0.10
    carbon: 0.15

  # ---------------------------------------------------------------------
  # Generic rule list. core/sentinel_gate.py's RuleEngine interprets
  # these by TYPE -- it has no hardcoded notion of "temperature bound" or
  # "CO2 ceiling". Add a rule here and it's enforced next run, with zero
  # code changes. Supported types:
  #   range      - value_source must stay within [min, max] (either bound
  #                optional, for a floor- or ceiling-only rule)
  #   pmv        - ASHRAE-55 Predicted Mean Vote comfort band check
  #   rate_limit - max allowed |proposed - last_setpoint| per control step
  # Set enabled: false to keep a rule defined but inactive.
  # ---------------------------------------------------------------------
  rules:
    - id: temp_bounds
      type: range
      value_source: setpoint
      min: 20.0
      max: 26.0
      hard: true
      description: "ASHRAE-55 operative temperature band (20-26C)"

    - id: pmv_comfort
      type: pmv
      band: 0.5
      hard: true
      description: "ASHRAE-55 acceptable PMV band (+/-0.5)"

    - id: rate_limit
      type: rate_limit
      max_delta_per_step: 2.0
      hard: false
      description: "Max setpoint change per control step (2.0C)"

    # Disabled until a real CO2 sensor value is passed in via
    # extra_values={"co2_ppm": ...} -- demonstrates that a brand-new
    # bound is a YAML edit (flip enabled: true), not a code change, once
    # the sensor signal exists.
    - id: co2_ceiling
      type: range
      value_source: co2_ppm
      max: 800
      hard: true
      enabled: false
      description: "CO2 ceiling (800ppm, IAQ) -- requires a live sensor"

strategist:
  model: "llama-3.1-8b-instant"
  call_timeout_s: 8
  correction_timeout_s: 5
  forecast_lookahead_hours: 3
  # Cadence: run the Strategist every N EnergyPlus system timesteps.
  #
  # FIX (this pass): raised from 60 -> 180. The step-420 log entry showed
  # a real Groq 429 with `Used 4934` tokens already burned in the current
  # 60-second TPM window before the next call even requested its 1516 --
  # i.e. multiple Strategist calls (each potentially 2 calls when a
  # correction round fires) were landing inside the same real-time
  # minute. EnergyPlus isn't real-time-synced, so it churns through
  # cadence_steps fast regardless of simulated hours -- tripling the
  # step count cuts real-world call frequency roughly 3x with zero code
  # change. This also indirectly helps the AI-vs-baseline step-count gap
  # (fewer network blocks per wall-clock minute = the AI instance
  # advances further in simulated time per real minute, so the aligned
  # comparison window in ui/app.py grows faster too).
  #
  # If 429s still occur after this change, the next lever is the same
  # one, further up (240+), before reaching for retry/backoff logic in
  # agents/strategist.py.
  cadence_steps: 300
  # Feature 3 -- forward look-ahead. If the forecast window swings by at
  # least this many degrees C from the current outdoor temp, the prompt
  # explicitly flags it and asks the Strategist to consider pre-acting.
  # Whether this fired is logged per-step (lookahead_triggered) so it's
  # demonstrable evidence, not an assumed behavior.
  lookahead:
    swing_threshold_c: 4.0

failsafe:
  # Bring the failsafe closer to our AI target (21.2)
  # This stops the "Energy Spikes" if the AI hits a rate limit.
  target_low_c: 21.0
  target_high_c: 21.5
  setback_c: 0.2

baseline:
  # Feature 2's comparison instance: a single fixed setpoint, no AI,
  # no gate -- what the building would do on a plain thermostat schedule.
  schedule_setpoint_c: 22.0

carbon:
  # Explicitly simulated/representative -- not a live grid feed. Now a
  # real weighted CCS term (gate.weights.carbon), not prompt-only
  # decoration -- see weight_map below.
  source: "simulated"
  profile: "flat_medium"   # key into `profiles` below
  cycle_steps: 30          # control steps before advancing to the next level

  profiles:
    flat_medium: ["Low", "Medium", "High"]
    day_peak: ["Low", "Medium", "High", "High", "Medium"]
    night_low: ["Low", "Low", "Medium", "High"]

  # Maps a carbon-intensity label to a CCS penalty in [0, 1]. A proposal
  # made during a "High" window is scored more conservatively than the
  # identical proposal during "Low" -- add/rename labels here freely as
  # long as every label your `profiles` list uses has an entry here.
  weight_map:
    Low: 0.0
    Medium: 0.4
    High: 1.0
  unknown_level_penalty: 0.5   # fallback if a label isn't in weight_map

paths:
  baseline_idf: "models/baseline.idf"
  controlled_idf: "models/controlled.idf"
  epw: "models/baseline.epw"
  control_log_ai: "logs/ai/control_log.jsonl"
  control_log_baseline: "logs/baseline/control_log.jsonl"