# --- SAFETY & COMFORT ---
safety:
  temp_min_c: 18.0
  temp_max_c: 28.0
  max_delta_c_per_step: 2.0

comfort:
  deadband_c: 2.0
  pmv_band: 0.5
  adaptive_band_half_width_c: 2.5
  outdoor_temp_ewma_alpha: 0.1     

# --- STABILITY (Hysteresis) ---
hysteresis:
  min_delta_c: 0.3                
  min_dwell_steps: 3              

# --- SEASONAL TARGETS ---
seasonality:
  winter_limit: 12.0
  summer_limit: 22.0
  comfort_ranges:
    winter: [21.0, 21.8] 
    summer: [23.5, 25.5] 
  clothing:
    winter_clo: 1.1      
    shoulder_clo: 0.7    
    summer_clo: 0.4      

# --- GATE SCORING ---
gate:
  ccs_threshold: 0.65
  weights:
    violation: 0.40
    rate_penalty: 0.15
    llm_confidence: 0.15
    override_rate: 0.10
    carbon: 0.20

# --- STRATEGIST ---
strategist:
  model: "llama-3.1-8b-instant"
  cadence_steps: 300              
  call_timeout_s: 10
  correction_timeout_s: 5
  forecast_lookahead_hours: 3

# --- FAILSAFE (The missing key that caused the error) ---
failsafe:
  target_low_c: 21.0
  target_high_c: 23.0
  setback_c: 1.0

# --- BASELINE ---
baseline:
  schedule_setpoint_c: 22.0

# --- PATHS ---
paths:
  controlled_idf: "models/controlled.idf"
  epw: "models/baseline.epw"
  control_log_ai: "logs/ai/control_log.jsonl"
  control_log_baseline: "logs/baseline/control_log.jsonl"